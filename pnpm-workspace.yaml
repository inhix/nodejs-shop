packages:
  - apps/*
  - packages/*

# Versions shared by several workspace packages. Reference them with "catalog:".
catalog:
  '@types/node': 26.6.6
  eslint: 10.15.0
  typescript: 6.0.3
  zod: 4.6.7

# Fail install when the Node version does not satisfy "engines".
engineStrict: true
# `pnpm add` saves exact versions (no ^ or ~).
saveExact: true
# Only resolve package versions published at least 7 days ago (minutes).
minimumReleaseAge: 10080
# Dependency install scripts run only when allowed here. Denied entries are not needed:
# ssh2 and cpu-features are optional native speedups (Testcontainers via SSH Docker hosts),
# protobufjs only prints a version check.
allowBuilds:
  cpu-features: false
  protobufjs: false
  ssh2: false
